name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MFilm-Android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: MFilm
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          echo "### Build errors" >> $GITHUB_STEP_SUMMARY
          grep -E "^e: |What went wrong|Caused by" -A3 build.log | head -60 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: MFilm-apk
          path: MFilm/app/build/outputs/apk/debug/app-debug.apk
